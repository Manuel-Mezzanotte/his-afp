@let srv = systemStatus.statoAPI().service;
@let db = systemStatus.statoAPI().database;
@let uptime = systemStatus.statoAPI().uptime;

<div class="status-grid">
  <article class="panel status-item">
    <i class="pi pi-server"></i>
    <div>
      <span>Backend API</span>
      <strong>Servizio applicativo</strong>
    </div>
    <p-tag
      [severity]="srv === 'UP' ? 'success' : 'danger'"
      value="{{ srv }}"
    />
  </article>
  <article class="panel status-item">
    <i class="pi pi-database"></i>
    <div>
      <span>Database</span>
      <strong>PostgreSQL</strong>
    </div>
    <p-tag
      [severity]="db === 'CONNECTED' ? 'success' : 'danger'"
      value="{{ db }}"
    />
  </article>
  <article class="panel status-item">
    <i class="pi pi-clock"></i>
    <div>
      <span>Tempo di attività</span>
      <strong>{{ uptime | number: '1.0-0' }} secondi</strong>
    </div>
    <p-tag
      [severity]="uptime > 0 ? 'success' : 'danger'"
      [value]="uptime > 0 ? 'ATTIVO' : 'NON DISPONIBILE'"
    />
  </article>
</div>

<div class="status-actions">
  <p-button
    (onClick)="systemStatus.fetchStatoAPI()"
    icon="pi pi-refresh"
    label="Aggiorna stato"
    variant="outlined"
  />
</div>
