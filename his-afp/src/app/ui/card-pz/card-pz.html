<article class="patient-card {{setBorder()}} {{setColoreDiStato()}}">
  <div class="patient-card-head">
    <div>
      <h2>{{ paziente().cognome }} {{ paziente().nome }}</h2>
      <span class="bracelet">{{ paziente().braccialetto }}</span>
    </div>
    <span class="triage-code">{{ paziente().codiceColore }}</span>
  </div>
  <div class="patient-card-body">
    <span class="pathology">{{ paziente().patologia }}</span>
    <p>{{ paziente().note }}</p>
  </div>
  <div class="patient-card-footer">
    <p-button
      (onClick)="navigateToSchedaPaziente()"
      icon="pi pi-file-edit"
      label="Apri scheda"
      size="small"
    />
  </div>
</article>
