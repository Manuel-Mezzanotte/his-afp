<header
  class="flex flex-col items-start gap-2 p-2 shadow-md backdrop-opacity-5 md:flex-row md:items-center"
>
  <!-- LOGO -->
  <div
    class="flex items-center justify-center"
  >
    <img alt="logoASUIT" class="w-28 md:w-40" src="logo-asuit.svg">
  </div>
  <!-- AZIENDA: Località + Reparto -->
  <div
    class="pl-1"
  >
    <h1 class="text-2xl font-bold text-primary md:text-4xl">{{ reparto }}</h1>
    <p class="text-sm text-primary md:text-md">
      {{ struttura }} -
      @switch (type) {
        @case ('PROD') {
          <p-tag severity="info" value="v{{version}} - {{type}}"/>
        }
        @case ('TEST') {
          <p-tag severity="success" value="v{{version}} - {{type}}"/>
        }
        @case ('SVI') {
          <p-tag severity="contrast" value="v{{version}} - {{type}}"/>
        }
        @case ('LOCAL') {
          <p-tag severity="secondary" value="v{{version}} - {{type}}"/>
        }
      }
    </p>
  </div>

  <!--  DIVIDER-->
  <p-divider class="hidden md:block" layout="vertical"/>
  <!--  <div class="border-amber-600 border-2 h-15 mx-1"></div>-->
  <!-- AZIONI -->
  <nav
    class="flex flex-row flex-wrap items-center gap-2 pl-0 md:gap-3 md:pl-4"
  >
    <p-button
      label="Lista PZ"
      routerLink="/lista-pz"
      variant="outlined"
    />
    <p-button
      label="Accettazione PZ"
      routerLink="/accettazione-pz"
      variant="outlined"
    />
    <p-button
      label="Ricerca PZ"
      routerLink="/ricerca-paziente"
      variant="outlined"
    />
    <p-button
      label="Personale"
      routerLink="/gestione-personale"
      variant="outlined"
    />
    <p-button
      label="Stato Servizi"
      routerLink="/stato-servizi"
      variant="outlined"
    />
  </nav>

  <div
    class="ml-auto mr-4"
  >
    <his-darckmode-selector/>
  </div>
</header>
