<header class="app-header">
  <div class="header-inner">
  <!-- LOGO -->
  <div class="brand-block">
    <img alt="logoASUIT" class="brand-logo" src="logo-asuit.svg">
    <div class="brand-copy">
      <h1>{{ reparto }}</h1>
      <div class="facility-row">
        <span>{{ struttura }}</span>
        @switch (type) {
          @case ('PROD') {
            <p-tag severity="info" value="v{{version}} - {{type}}"/>
          }
          @case ('TEST') {
            <p-tag severity="success" value="v{{version}} - {{type}}"/>
          }
          @case ('SVI') {
            <p-tag severity="contrast" value="v{{version}} - {{type}}"/>
          }
          @case ('LOCAL') {
            <p-tag severity="secondary" value="v{{version}} - {{type}}"/>
          }
        }
      </div>
    </div>
  </div>

  <!--  DIVIDER-->
  <p-divider class="header-divider" layout="vertical"/>
  <!--  <div class="border-amber-600 border-2 h-15 mx-1"></div>-->
  <!-- AZIONI -->
  <nav class="main-nav">
    <p-button
      icon="pi pi-users"
      label="Lista PZ"
      routerLink="/lista-pz"
      routerLinkActive="nav-active"
      [routerLinkActiveOptions]="{ exact: true }"
      text
    />
    <p-button
      icon="pi pi-user-plus"
      label="Accettazione PZ"
      routerLink="/accettazione-pz"
      routerLinkActive="nav-active"
      text
    />
    <p-button
      icon="pi pi-id-card"
      label="Personale"
      routerLink="/gestione-personale"
      routerLinkActive="nav-active"
      text
    />
    <p-button
      icon="pi pi-chart-bar"
      label="Report"
      routerLink="/report"
      routerLinkActive="nav-active"
      text
    />
    <p-button
      icon="pi pi-server"
      label="Stato Servizi"
      routerLink="/stato-servizi"
      routerLinkActive="nav-active"
      text
    />
  </nav>

  <div class="theme-control">
    <his-darckmode-selector/>
  </div>
  </div>
</header>
