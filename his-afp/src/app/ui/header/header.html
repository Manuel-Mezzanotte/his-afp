<header class="app-header">
  <div class="identity-strip">
    <div class="header-inner">
      <!-- LOGO -->
      <div class="brand-block">
        <img alt="logoASUIT" class="brand-logo" src="logo-asuit.svg">
        <!--  DIVIDER-->
        <span class="brand-divider"></span>
        <!--  <div class="border-amber-600 border-2 h-15 mx-1"></div>-->
        <div class="brand-copy">
          <span class="department-label">Emergenza e urgenza</span>
          <h1>{{ reparto }}</h1>
          <span class="facility-name">{{ struttura }}</span>
        </div>
      </div>

      <div class="header-tools">
        @switch (type) {
          @case ('PROD') {
            <p-tag severity="info" value="v{{version}} - {{type}}"/>
          }
          @case ('TEST') {
            <p-tag severity="success" value="v{{version}} - {{type}}"/>
          }
          @case ('SVI') {
            <p-tag severity="contrast" value="v{{version}} - {{type}}"/>
          }
          @case ('LOCAL') {
            <p-tag severity="secondary" value="v{{version}} - {{type}}"/>
          }
        }
        <span class="tools-divider"></span>
        <div class="theme-control">
          <his-darckmode-selector/>
        </div>
      </div>
    </div>
  </div>

  <!-- AZIONI -->
  <nav class="main-nav" aria-label="Navigazione principale">
    <div class="nav-inner">
    <p-button
      icon="pi pi-users"
      label="Lista PZ"
      routerLink="/lista-pz"
      routerLinkActive="nav-active"
      [routerLinkActiveOptions]="{ exact: true }"
      text
    />
    <p-button
      icon="pi pi-user-plus"
      label="Accettazione PZ"
      routerLink="/accettazione-pz"
      routerLinkActive="nav-active"
      text
    />
    <p-button
      icon="pi pi-id-card"
      label="Personale"
      routerLink="/gestione-personale"
      routerLinkActive="nav-active"
      text
    />
    <p-button
      icon="pi pi-chart-bar"
      label="Report"
      routerLink="/report"
      routerLinkActive="nav-active"
      text
    />
    <p-button
      icon="pi pi-server"
      label="Stato Servizi"
      routerLink="/stato-servizi"
      routerLinkActive="nav-active"
      text
    />
    </div>
  </nav>
</header>
